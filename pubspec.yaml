name: the_yogini_journey
description: An offline preview of The Yogini Journey.
publish_to: none
version: 0.1.7+8
environment:
  sdk: ^3.13.0
  flutter: ">=3.50.0"
dependencies:
  cloud_firestore: ^7.2.0
  file_picker: ^13.4.0
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  firebase_storage: ^14.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  material_ui: ^1.11.1
  http: ^1.6.0
  pdf: ^3.12.0
  printing: ^5.15.1
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  shared_preferences: ^2.5.6
  # Use the Android implementation without JNI native build tools.
  shared_preferences_android: 2.4.28
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
